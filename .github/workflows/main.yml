name: Full Stack Docker CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build frontend, backend, and mongo using Docker Compose
        run: |
          docker compose -f docker-compose.yml build

      - name: Run containers (backend & frontend)
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 10  # Give services time to start

      - name: Health check - backend
        run: |
          curl --retry 5 --retry-delay 5 --fail http://localhost:5000/

      - name: Health check - frontend
        run: |
          curl --retry 5 --retry-delay 5 --fail http://localhost:3000/

      - name: Tear down
        if: always()
        run: docker compose down

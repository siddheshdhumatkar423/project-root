name: Full Stack Docker CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Docker Buildx (for multi-platform support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache Docker layers (for faster builds)
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Build the frontend and backend images using Docker Compose
      - name: Build frontend and backend with Docker Compose
        run: |
          docker compose -f docker-compose.yml build

      # Run the containers (frontend, backend, and mongo)
      - name: Run containers
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 10  # Wait for services to start

      # Check if the backend API is available (health check)
      - name: Health check - backend
        run: |
          curl --retry 5 --retry-delay 5 --fail http://localhost:5000/

      # Check if the frontend is available (health check)
      - name: Health check - frontend
        run: |
          curl --retry 5 --retry-delay 5 --fail http://localhost:3000/

      # Tear down the containers after the test
      - name: Tear down
        if: always()
        run: docker compose down
